<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SmartQA – Test Case Generator</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            navy: { 950: '#0f172a', 900: '#1e293b', 800: '#1e3a5f', 700: '#1d4ed8' },
            accent: '#f97316'
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="min-h-screen bg-slate-950 text-slate-100 font-sans antialiased">

  <!-- Header -->
  <header class="border-b border-slate-800 bg-slate-900/80 backdrop-blur sticky top-0 z-20">
    <div class="max-w-5xl mx-auto px-4 py-4 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-8 h-8 rounded-lg bg-orange-500 flex items-center justify-center text-white font-bold text-sm">QA</div>
        <span class="text-lg font-semibold tracking-tight">SmartQA <span class="text-orange-400 font-normal">Test Case Generator</span></span>
      </div>
      <span id="historyBadge" class="hidden text-xs bg-slate-800 border border-slate-700 text-slate-400 rounded-full px-3 py-1">
        💾 History loaded
      </span>
    </div>
  </header>

  <main class="max-w-5xl mx-auto px-4 py-8 space-y-6">

    <!-- Input Card -->
    <section class="card">
      <h2 class="section-title">📋 Feature / User Story</h2>

      <!-- Quick Template -->
      <div class="mb-4">
        <label class="block text-xs font-semibold text-slate-400 mb-2 uppercase tracking-wider">Quick Template</label>
        <select id="quickTemplate" class="input-select">
          <option value="">— Pilih Template —</option>
          <option value="login">Fitur Login Akun</option>
          <option value="checkout">Fitur Checkout Belanja</option>
          <option value="reset">Fitur Reset Password</option>
          <option value="register">Fitur Registrasi Pengguna</option>
          <option value="search">Fitur Pencarian Produk</option>
        </select>
      </div>

      <!-- Textarea -->
      <div class="mb-4">
        <label class="block text-xs font-semibold text-slate-400 mb-2 uppercase tracking-wider">Deskripsi Fitur</label>
        <textarea
          id="featureInput"
          rows="6"
          placeholder="Tulis deskripsi fitur atau user story di sini…&#10;Contoh: Sebagai pengguna, saya ingin dapat login menggunakan email dan password agar bisa mengakses akun saya."
          class="input-textarea"
        ></textarea>
      </div>

      <!-- Coverage Checkboxes -->
      <div class="mb-5">
        <label class="block text-xs font-semibold text-slate-400 mb-3 uppercase tracking-wider">Cakupan Pengujian</label>
        <div class="flex flex-wrap gap-4">
          <label class="checkbox-label">
            <input type="checkbox" id="chkPositive" checked class="checkbox-input" />
            <span class="badge badge-positive">✔ Positive</span>
          </label>
          <label class="checkbox-label">
            <input type="checkbox" id="chkNegative" checked class="checkbox-input" />
            <span class="badge badge-negative">✘ Negative</span>
          </label>
          <label class="checkbox-label">
            <input type="checkbox" id="chkEdge" checked class="checkbox-input" />
            <span class="badge badge-edge">⚡ Edge Case</span>
          </label>
        </div>
      </div>

      <!-- Generate Button -->
      <button id="btnGenerate" class="btn-primary w-full">
        <span id="btnText">⚙ Generate Test Cases</span>
        <span id="btnSpinner" class="hidden ml-2 inline-block w-4 h-4 border-2 border-white border-t-transparent rounded-full animate-spin"></span>
      </button>
    </section>

    <!-- Result Section -->
    <section id="resultSection" class="hidden space-y-4">

      <!-- Toolbar -->
      <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3">
        <!-- Filter Tabs -->
        <div id="filterBar" class="flex flex-wrap gap-2">
          <button class="filter-btn active" data-filter="all">All <span class="filter-count" id="countAll">0</span></button>
          <button class="filter-btn" data-filter="positive">Positive <span class="filter-count" id="countPositive">0</span></button>
          <button class="filter-btn" data-filter="negative">Negative <span class="filter-count" id="countNegative">0</span></button>
          <button class="filter-btn" data-filter="edge">Edge Case <span class="filter-count" id="countEdge">0</span></button>
        </div>
        <!-- Action Buttons -->
        <div class="flex gap-2">
          <button id="btnCopy" class="btn-secondary" title="Copy table as text">
            📋 Copy
          </button>
          <button id="btnExport" class="btn-secondary" title="Export to CSV">
            ⬇ Export CSV
          </button>
        </div>
      </div>

      <!-- Toast -->
      <div id="toast" class="hidden toast">✔ Berhasil disalin ke clipboard!</div>

      <!-- Table Card -->
      <div class="card overflow-x-auto p-0">
        <table id="testTable" class="w-full text-sm">
          <thead>
            <tr class="border-b border-slate-700 bg-slate-800/60">
              <th class="th-cell w-20">ID</th>
              <th class="th-cell w-28">Tipe Uji</th>
              <th class="th-cell">Skenario</th>
              <th class="th-cell">Langkah Pengujian</th>
              <th class="th-cell">Hasil yang Diharapkan</th>
            </tr>
          </thead>
          <tbody id="tableBody" class="divide-y divide-slate-800">
            <!-- rows injected by script.js -->
          </tbody>
        </table>
      </div>

      <!-- Empty state -->
      <div id="emptyState" class="hidden text-center py-10 text-slate-500 text-sm">
        Tidak ada test case yang cocok dengan filter ini.
      </div>
    </section>

  </main>

  <footer class="mt-12 border-t border-slate-800 py-5 text-center text-xs text-slate-600">
    SmartQA Test Case Generator &mdash; built with ❤ for QA Engineers
  </footer>

  <script src="script.js"></script>
</body>
</html>
